[changelog]
header = """
# Changelog

All notable changes to aodd-aisdlc are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and it follows
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)\
{% if commit.breaking %} **BREAKING**{% endif %}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^(refactor|perf)", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^Initial release", group = "Added" },
  { message = "^(test|chore|build|ci|style)", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
